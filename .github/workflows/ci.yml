name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, formatting, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          # The server uses only the standard library, so there is no go.sum.
          cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend and workflow formatting
        run: npm run format:check

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l cmd internal web/embed.go)"
          if [[ -n "$unformatted" ]]; then
            echo "Run gofmt on these files:" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi

      # Go embeds web/dist, so the frontend must be built before Go checks.
      - name: Type-check and build the frontend
        run: npm run build

      - name: Test the frontend
        run: npm test

      - name: Check Go with vet
        run: go vet ./...

      - name: Test Go with the race detector
        run: go test -race ./...

      - name: Build the application
        run: go build -o bin/differ ./cmd/differ
